# Perfil isolado de staging. Os segredos ficam em .env.staging (ignorado pelo Git)
# ou em variáveis de ambiente STAGING_* configuradas no IntelliJ.
spring.config.import=file:./.env.staging[.properties]

server.port=${STAGING_SERVER_PORT:8081}
app.time-zone=${STAGING_BARBEARIA_TIME_ZONE:America/Sao_Paulo}

# URL JDBC copiada do painel Supabase, obrigatoriamente com sslmode=require.
spring.datasource.url=${STAGING_DB_URL}
spring.datasource.username=${STAGING_DB_USERNAME}
spring.datasource.password=${STAGING_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Staging não executa migrations; Hibernate apenas valida o schema existente.
spring.flyway.enabled=false
spring.flyway.url=${STAGING_DB_URL}
spring.flyway.user=${STAGING_DB_USERNAME}
spring.flyway.password=${STAGING_DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.generate-ddl=false
spring.sql.init.mode=never
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false
app.scheduling.enabled=false

# Credencial JWT separada do ambiente local/prod.
jwt.secret=${STAGING_JWT_SECRET}
jwt.expiration=${STAGING_JWT_EXPIRATION:900000}

# Evita reutilizar integrações e credenciais de e-mail do .env local.
app.password-reset-url=${STAGING_PASSWORD_RESET_URL:http://localhost:5173/redefinir-senha}
app.password-reset-expiration-minutes=${STAGING_PASSWORD_RESET_EXPIRATION_MINUTES:15}

# Bootstrap e notificações externas permanecem desligados por padrão em staging.
app.bootstrap-admin.enabled=${STAGING_BOOTSTRAP_ADMIN_ENABLED:false}
app.bootstrap-admin.nome=${STAGING_BOOTSTRAP_ADMIN_NOME:}
app.bootstrap-admin.telefone=${STAGING_BOOTSTRAP_ADMIN_TELEFONE:}
app.bootstrap-admin.email=${STAGING_BOOTSTRAP_ADMIN_EMAIL:}
app.bootstrap-admin.password=${STAGING_BOOTSTRAP_ADMIN_PASSWORD:}
app.notificacoes.resend.ativo=${STAGING_NOTIFICACOES_RESEND_ATIVO:false}
app.notificacoes.resend.api-key=${STAGING_RESEND_API_KEY:}
app.notificacoes.resend.remetente=${STAGING_RESEND_REMETENTE:}
app.cors.allowed-origins=${STAGING_CORS_ALLOWED_ORIGINS:http://localhost:5173}
