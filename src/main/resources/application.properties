spring.application.name=barbersystem
# Permite que o IntelliJ e o terminal leiam o .env local sem copiar segredos
# para arquivos de configuração versionados. Variáveis do sistema têm precedência.
spring.config.import=optional:file:./.env[.properties],optional:file:./barber-system/.env[.properties]
server.port=${SERVER_PORT:8080}
app.time-zone=${BARBEARIA_TIME_ZONE:America/Sao_Paulo}

# PostgreSQL do Supabase.
spring.datasource.url=${DB_URL}

# Nome do usuario do banco de dados
spring.datasource.username=${DB_USERNAME}

# Senha do usuario do banco de dados
spring.datasource.password=${DB_PASSWORD}

spring.datasource.driver-class-name=org.postgresql.Driver

# Flyway gerencia a estrutura; Hibernate apenas confirma que entidades e schema coincidem.
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true

# Mostra no console os comandos SQL executados pela aplicacao
spring.jpa.show-sql=${JPA_SHOW_SQL:false}

# Formata o SQL exibido no console para facilitar a leitura
spring.jpa.properties.hibernate.format_sql=true

# ============================================
# JWT
# Em producao, defina a variavel de ambiente JWT_SECRET (>=32 caracteres).
# Gere uma com: openssl rand -base64 32
# ============================================
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:7200000}

# E-mail usado no fluxo de recuperação de senha.
spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:25}
spring.mail.username=${SMTP_USERNAME:no-reply@barbearia.local}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:false}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
app.password-reset-url=${PASSWORD_RESET_URL:http://localhost:5173/redefinir-senha}
app.password-reset-from=${PASSWORD_RESET_FROM:no-reply@barbearia.local}
app.password-reset-expiration-minutes=${PASSWORD_RESET_EXPIRATION_MINUTES:15}
app.bootstrap-admin.enabled=${BOOTSTRAP_ADMIN_ENABLED:false}
app.bootstrap-admin.nome=${BOOTSTRAP_ADMIN_NOME:}
app.bootstrap-admin.telefone=${BOOTSTRAP_ADMIN_TELEFONE:}
app.bootstrap-admin.email=${BOOTSTRAP_ADMIN_EMAIL:}
app.bootstrap-admin.password=${BOOTSTRAP_ADMIN_PASSWORD:}

# Integrações de notificação (desabilitadas por padrão; nenhum segredo versionado).
app.notificacoes.resend.ativo=${NOTIFICACOES_RESEND_ATIVO:false}
app.notificacoes.resend.api-key=${RESEND_API_KEY:}
app.notificacoes.resend.remetente=${RESEND_REMETENTE:}
app.notificacoes.whatsapp.ativo=${NOTIFICACOES_WHATSAPP_ATIVO:false}
app.notificacoes.whatsapp.url-base=${WHATSAPP_GRAPH_URL:https://graph.facebook.com}
app.notificacoes.whatsapp.versao-graph=${WHATSAPP_GRAPH_VERSION:}
app.notificacoes.whatsapp.phone-number-id=${WHATSAPP_PHONE_NUMBER_ID:}
app.notificacoes.whatsapp.business-account-id=${WHATSAPP_BUSINESS_ACCOUNT_ID:}
app.notificacoes.whatsapp.token-acesso=${WHATSAPP_ACCESS_TOKEN:}
app.notificacoes.whatsapp.codigo-pais-padrao=${WHATSAPP_CODIGO_PAIS:}
app.notificacoes.whatsapp.modelos.CONFIRMACAO.nome=${WHATSAPP_TEMPLATE_CONFIRMACAO:}
app.notificacoes.whatsapp.modelos.CONFIRMACAO.idioma=${WHATSAPP_TEMPLATE_CONFIRMACAO_IDIOMA:}
app.notificacoes.whatsapp.modelos.LEMBRETE_24H.nome=${WHATSAPP_TEMPLATE_LEMBRETE_24H:}
app.notificacoes.whatsapp.modelos.LEMBRETE_24H.idioma=${WHATSAPP_TEMPLATE_LEMBRETE_24H_IDIOMA:}
app.notificacoes.whatsapp.modelos.LEMBRETE_1H.nome=${WHATSAPP_TEMPLATE_LEMBRETE_1H:}
app.notificacoes.whatsapp.modelos.LEMBRETE_1H.idioma=${WHATSAPP_TEMPLATE_LEMBRETE_1H_IDIOMA:}
app.notificacoes.whatsapp.modelos.LEMBRETE_30MIN.nome=${WHATSAPP_TEMPLATE_LEMBRETE_30MIN:}
app.notificacoes.whatsapp.modelos.LEMBRETE_30MIN.idioma=${WHATSAPP_TEMPLATE_LEMBRETE_30MIN_IDIOMA:}
app.notificacoes.whatsapp.modelos.CANCELAMENTO.nome=${WHATSAPP_TEMPLATE_CANCELAMENTO:}
app.notificacoes.whatsapp.modelos.CANCELAMENTO.idioma=${WHATSAPP_TEMPLATE_CANCELAMENTO_IDIOMA:}
app.notificacoes.max-tentativas=${NOTIFICACOES_MAX_TENTATIVAS:5}
app.notificacoes.intervalo-ms=${NOTIFICACOES_INTERVALO_MS:30000}
app.notificacoes.lease-minutos=${NOTIFICACOES_LEASE_MINUTOS:5}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*,http://10.0.2.2:*}
