# Produção não usa padrões de desenvolvimento nem credenciais administrativas no runtime.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}
app.bootstrap-admin.enabled=${BOOTSTRAP_ADMIN_ENABLED:false}
app.password-reset-url=${PASSWORD_RESET_URL}
jwt.expiration=${JWT_EXPIRATION:900000}
spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=validate
app.supabase.project-ref=${SUPABASE_PROJECT_REF:}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:5}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:1}
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT_MS:10000}
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.error.include-exception=false
