# Banco em memória dedicado aos testes; não replica nem modifica o banco local.
spring.datasource.url=jdbc:h2:mem:barber-tests;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.flyway.enabled=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.sql.init.mode=never
jwt.secret=test-only-jwt-secret-with-more-than-32-bytes
jwt.expiration=3600000
app.password-reset-url=http://localhost/redefinir-senha
spring.mail.host=localhost
spring.mail.port=25
